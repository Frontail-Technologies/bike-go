services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ridego
      POSTGRES_PASSWORD: ridego
      POSTGRES_DB: ridego
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridego -d ridego"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ridego-postgres:/var/lib/postgresql/data

volumes:
  ridego-postgres:
