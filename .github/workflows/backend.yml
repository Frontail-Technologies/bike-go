name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ridego
          POSTGRES_PASSWORD: ridego
          POSTGRES_DB: ridego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridego -d ridego_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ridego:ridego@localhost:5432/ridego_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test suite on in-memory PGlite
        run: env -u TEST_DATABASE_URL bun test
      - name: Booking concurrency and idempotency on PostgreSQL
        run: bun run test:concurrency
      - name: Full test suite on PostgreSQL
        run: bun test
      - name: Migrations apply to an empty database and seed runs twice
        env:
          DATABASE_URL: postgres://ridego:ridego@localhost:5432/ridego_test
        run: |
          psql "postgres://ridego:ridego@localhost:5432/ridego_test" -c "DROP SCHEMA public CASCADE; DROP SCHEMA IF EXISTS drizzle CASCADE; CREATE SCHEMA public;"
          bun run db:migrate
          bun run db:seed
          bun run db:seed
